name: Load test (test Sheet)

# Manual only: this writes real rows and PDFs to the TEST Sheet/Drive folder
# and spends Apps Script quota. Requires the TEST_SHEET_ENDPOINT secret.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Peak concurrent submitters
        default: '30'
      ramp:
        description: Ramp-up duration
        default: 2m
      hold:
        description: Time held at peak
        default: 1m

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_ENDPOINT: ${{ secrets.TEST_SHEET_ENDPOINT }}
      PROD_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
    steps:
      - name: Check the target is the test backend
        run: |
          if [ -z "$TEST_ENDPOINT" ]; then
            echo "::error::TEST_SHEET_ENDPOINT secret is not set (see google-apps-script/README.md)."; exit 1
          fi
          if [ -n "$PROD_ENDPOINT" ] && [ "$TEST_ENDPOINT" = "$PROD_ENDPOINT" ]; then
            echo "::error::TEST_SHEET_ENDPOINT is the production endpoint. Refusing."; exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # One real browser submission first: proves the full path (form → PDF → Sheet → Drive) works.
      - name: Live smoke submission
        run: npx playwright test --project=desktop-chromium
        env:
          LIVE: '1'
          LIVE_ENDPOINT: ${{ secrets.TEST_SHEET_ENDPOINT }}

      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        run: |
          mkdir -p load/results
          k6 run \
            -e ENDPOINT="$TEST_ENDPOINT" \
            -e PROD_ENDPOINT="$PROD_ENDPOINT" \
            -e RUN_ID="${{ github.run_id }}" \
            -e VUS="${{ inputs.vus }}" \
            -e RAMP="${{ inputs.ramp }}" \
            -e HOLD="${{ inputs.hold }}" \
            load/submit.js

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Load test run ${{ github.run_id }}"
            echo "Rows are named \`LOADTEST-${{ github.run_id }}-*\` in the test Sheet; the row count should match *iterations* below."
            echo '```'
            cat load/results/summary.txt 2>/dev/null || echo "k6 produced no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: load-test-results
          path: |
            load/results/
            playwright-report/
